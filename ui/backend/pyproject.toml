[project]
name = "galley"
version = "0.1.0"
description = "Web console for the FYP-Radiance FiGS / SOUS-VIDE pipeline"
requires-python = ">=3.10"
# Runs in its OWN venv (uv), never inside the kitchen conda env: it only launches
# pipeline processes, so it must not touch the pinned torch stack.
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27", "tensorboardX>=2.6"]

[project.scripts]
galley = "galley.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["galley*"]
