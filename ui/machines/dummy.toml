# dummy — MSI laptop, Ubuntu 24.04, RTX 3050 Ti Laptop 4 GB, 15 GiB RAM.
# Install made by install_figs.sh with its default prefix (~/projects/figs_validation).

[paths]
project_root = "~/projects/figs_validation"          # figs_env.sh + SousVide/
pipeline     = "~/FYP-Radiance/figs/figs_pipeline.py"
overlay      = "~/FYP-Radiance/figs/sousvide_overlay" # saved captures/courses/pilots are mirrored here
video_dir    = "~/FYP-Radiance/video_captures"        # raw footage staging (FiGS cannot see it)
data_dir     = "~/.local/share/galley"                # galley.db

[server]
host = "0.0.0.0"   # ufw limits it to the LAN and tailscale0 (Phase 5)
port = 8800

[gpu]
name     = "NVIDIA GeForce RTX 3050 Ti Laptop GPU"
vram_mib = 4096

[defaults]
# Measured 2026-09-27 (ui/deploy/phase2_train_probe.sh): backroom at the default 960x540,
# 30k steps, --cache-images cpu -> peak 2360 MiB, 60 min, flight identical to the shipped
# model. Simulation peaks at ~614 MiB. The UI pre-fills these in its training forms.
cache_images = "cpu"
train_vis = "tensorboard"
max_data_method = "data_beta"
# SV-Net (Phase 4): commNet's in-loop evaluation. The notebook uses eval_nominal (10 full-course
# flights of expert + student every lim_sv epochs); eval_single flies one, ~10x cheaper on dummy.
svnet_comm_eval = "eval_single"
# Semantic lift on 4 GB: half the render width of intellisense08 (untested here so far).
semantic_feat_width = 480
semantic_worker_idle_s = 600
